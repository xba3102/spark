        const formatDateToDMY = (dateStr) => {
            if (!dateStr) return "N/A";
            const parts = dateStr.split('-');
            return parts.length === 3 ? (parts[0].length === 4 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dateStr) : dateStr;
        };

        const getCurrentFormattedDate = () => {
            const d = new Date();
            return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
        };

        const categoriesMatch = (athCat, evCat) => {
            if (!athCat || !evCat) return false;
            const a = athCat.trim().toUpperCase().replace(/\s+/g, '');
            const e = evCat.trim().toUpperCase().replace(/\s+/g, '');
            if (a === e || e === "TERBUKA" || e === "KESELURUHAN") return true;

            const parseCat = (cat) => {
                const jantina = cat.startsWith('L') ? 'L' : (cat.startsWith('P') ? 'P' : null);
                const umurMatch = cat.match(/\d+/);
                const umur = umurMatch ? parseInt(umurMatch[0]) : 99;
                return { jantina, umur };
            };

            const aParsed = parseCat(a); const eParsed = parseCat(e);
            if (aParsed.jantina && eParsed.jantina && aParsed.jantina !== eParsed.jantina) return false;
            
            if (e.includes("TKB")) {
                return aParsed.umur <= eParsed.umur && aParsed.umur >= eParsed.umur - 2;
            } else if (e.includes("BAWAH") || e.includes("B") || e.includes("U")) {
                if (aParsed.umur <= eParsed.umur) return true;
            }
            return aParsed.umur === eParsed.umur;
        };

        const App = () => {
            const [userRole, setUserRole] = useState("pelawat");
            const [currentUser, setCurrentUser] = useState(null);
            const [isCloudActive, setIsCloudActive] = useState(false);

            const [categories, setCategories] = useState(["L12TKB", "P12TKB", "L10TKB", "P10TKB", "Prasekolah", "Terbuka"]);

            const [activeYear, setActiveYear] = useState(() => localStorage.getItem('sps_active_year') || new Date().getFullYear().toString());

            // Lock System States

            const [showLockModal, setShowLockModal] = useState(false);

            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);

            const [certSignatory1Name, setCertSignatory1Name] = useState(() => localStorage.getItem('sps_sig1_name') || "SITI NURHALIZA");

            const [certSignatory2Name, setCertSignatory2Name] = useState(() => localStorage.getItem('sps_sig2_name') || "AHMAD ALBAB");
            const [certSignatory2Title, setCertSignatory2Title] = useState(() => localStorage.getItem('sps_sig2_title') || "Penolong Kanan Kokurikulum");
            const [certSignatory3Name, setCertSignatory3Name] = useState(() => localStorage.getItem('sps_sig3_name') || "ADAM CORRIE");
            const [certSignatory3Title, setCertSignatory3Title] = useState(() => localStorage.getItem('sps_sig3_title') || "Guru Besar");
            
            const [certShowSignatory1, setCertShowSignatory1] = useState(() => localStorage.getItem('sps_sig1_show') !== 'false');
            const [certShowSignatory2, setCertShowSignatory2] = useState(() => localStorage.getItem('sps_sig2_show') !== 'false');
            const [certShowSignatory3, setCertShowSignatory3] = useState(() => localStorage.getItem('sps_sig3_show') !== 'false');

            const [athleteForm, setAthleteForm] = useState({ id: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12TKB" });

            const [isBulkModalOpen, setIsBulkModalOpen] = useState(false);

            const [isEventSidebarOpen, setIsEventSidebarOpen] = useState(false);
            const [isEditingEvent, setIsEditingEvent] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState("");

            const [houseForm, setHouseForm] = useState({ nama: "", slogan: "", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Ungu" });

            const [bestAthleteMaleCat, setBestAthleteMaleCat] = useState("");

            const [bestMaleResults, setBestMaleResults] = useState([]);
            const [bestFemaleResults, setBestFemaleResults] = useState([]);

            const [recordForm, setRecordForm] = useState({id:"", acara:"", kategori:categories[0]||"L12TKB", catatan:"", nama:"", tahun:activeYear});
            const [showRecordForm, setShowRecordForm] = useState(false);

            const [kokumManualText, setKokumManualText] = useState(() => localStorage.getItem('sps_kokum_manual') || `<b>1. Kehadiran Tetamu / Jemputan:</b><br><br><br><b>2. Kewangan & Perbelanjaan:</b><br><br><br><b>3. Kekuatan Program:</b><br><br><br><b>4. Isu / Cabaran & Cadangan Penambahbaikan:</b><br><br><br>`);
            const [currentPrintMode, setCurrentPrintMode] = useState("");

            const adminMenuRef = useRef(null);
            const fileInputRef = useRef(null);

            const activeSchoolName = localStorage.getItem('sps_school_name') || DEFAULT_SCHOOL_NAME;
            const activeSchoolSubtitle = localStorage.getItem('sps_school_subtitle') || DEFAULT_SCHOOL_SUBTITLE;
            const logoUrl = localStorage.getItem('sps_school_logo') || DEFAULT_SCHOOL_LOGO;

            useEffect(() => {
                if (resultForm.eventId) {
                    const initGrid = {};
                    results.filter(r => r.eventId === resultForm.eventId).forEach(r => {

                } else {
                    setGridResults({});

            }, [resultForm.eventId, results]);
            
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (adminMenuRef.current && !adminMenuRef.current.contains(event.target)) {
                        setIsAdminMenuOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            useEffect(() => {
                if (!isCloudAvailable || !auth) { setIsCloudActive(false); return; }
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) { setCurrentUser(user); setIsCloudActive(true); } 
                    else {
                        const cRole = localStorage.getItem('sps_local_role');
                        if (cRole) {
                            setCurrentUser({ displayName: localStorage.getItem('sps_local_name') || (cRole === 'urusetia' ? "Urusetia" : "Pentadbir"), email: localStorage.getItem('sps_local_email') });
                            setUserRole(cRole); setIsCloudActive(true);
                        } else { setCurrentUser(null); setUserRole("pelawat"); }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (userRole === "pelawat" && ["rumah_sukan", "acara", "atlit", "pasca_sukan", "ramalan"].includes(activeTab)) {
                    setActiveTab("dashboard");
                }
                if ((userRole === "guru" || userRole === "urusetia") && activeTab === "ramalan") {
                    setActiveTab("dashboard");
                }
            }, [userRole, activeTab]);

            // Auto-Lock Timer Logic
            useEffect(() => {
                let isLockedNow = lockConfig.isLocked === true;
                if (!isLockedNow && lockConfig.autoLockDate) {
                    const lockTime = new Date(lockConfig.autoLockDate).getTime();
                    if (!isNaN(lockTime) && new Date().getTime() >= lockTime) {
                        isLockedNow = true;
                    }
                }
                setIsSystemLocked(isLockedNow);

                const interval = setInterval(() => {
                    if (lockConfig.isLocked) return; 
                    if (lockConfig.autoLockDate) {
                        const lockTime = new Date(lockConfig.autoLockDate).getTime();
                        if (!isNaN(lockTime) && new Date().getTime() >= lockTime) {
                            setIsSystemLocked(true);
                        } else {
                            setIsSystemLocked(false);
                        }
                    }
                }, 10000); 

                return () => clearInterval(interval);
            }, [lockConfig]);

            useEffect(() => {
                if (!isCloudActive || !db) return;
                const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubAth = base.collection('athletes').onSnapshot(snap => setAthletes(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubEv = base.collection('events').onSnapshot(snap => setEvents(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubRes = base.collection('results').onSnapshot(snap => setResults(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubHeat = base.collection('heats').onSnapshot(snap => setHeats(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubRec = base.collection('records').onSnapshot(snap => setRecords(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubAnn = base.collection('announcements').onSnapshot(snap => {
                    const a = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    a.sort((x,y) => y.id.localeCompare(x.id)); setAnnouncements(a);
                });
                const unsubLog = base.collection('logs').onSnapshot(snap => {
                    const l = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    l.sort((x,y) => y.id.localeCompare(x.id)); setLogs(l);
                });
                const unsubMeta = base.collection('metadata').doc('houses').onSnapshot(doc => { 
                    if (doc.exists) {
                        const fetchedData = doc.data();
                        const mergedHouses = { ...INITIAL_HOUSES };
                        Object.keys(fetchedData).forEach(key => { mergedHouses[key] = fetchedData[key]; });
                        setHousesMetadata(mergedHouses);
                    } else { setHousesMetadata(INITIAL_HOUSES); }
                });
                const unsubConf = base.collection('metadata').doc('config').onSnapshot(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        if (d.categories) { setCategories(d.categories); }
                        if (d.maxIndividu !== undefined) setMaxIndividu(d.maxIndividu);
                        if (d.maxKumpulan !== undefined) setMaxKumpulan(d.maxKumpulan);
                        if (d.activeYear) setActiveYear(d.activeYear);
                    }
                });
                const unsubPts = base.collection('metadata').doc('points').onSnapshot(doc => { if(doc.exists) setPointsConfig(doc.data()); });
                const unsubAdmins = base.collection('metadata').doc('admins').onSnapshot(doc => { if(doc.exists) setAdminList(doc.data().list || []); });
                const unsubLock = base.collection('metadata').doc('systemLock').onSnapshot(doc => { if(doc.exists) setLockConfig(doc.data()); });

                return () => { unsubAth(); unsubEv(); unsubRes(); unsubHeat(); unsubRec(); unsubAnn(); unsubLog(); unsubMeta(); unsubConf(); unsubPts(); unsubAdmins(); unsubLock(); };
            }, [isCloudActive]);

            useEffect(() => {
                if (categories.length > 0) {
                    if (!bestAthleteMaleCat) setBestAthleteMaleCat(categories.find(c => !c.toUpperCase().startsWith('P')) || "");
                    if (!bestAthleteFemaleCat) setBestAthleteFemaleCat(categories.find(c => !c.toUpperCase().startsWith('L')) || "");
                }
            }, [categories]);

            useEffect(() => {
                if (!currentUser) return;
                const email = (currentUser.email || "").toLowerCase();
                if (email === "sekolah-7608@moe-dl.edu.my" || adminList.map(a => typeof a === 'string' ? a.toLowerCase() : "").includes(email)) setUserRole("admin");
                else if (email.endsWith("@moe-dl.edu.my") || email.endsWith("@moe.edu.my")) setUserRole("guru");
                else {
                    const localR = localStorage.getItem('sps_local_role');
                    if (localR) { setUserRole(localR); }
                    else if (!currentUser.isAnonymous) setUserRole("pelawat");
                }
            }, [currentUser, adminList]);

            const showToastMessage = (message, type = "success") => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: "", type: "info" }), 4000);
            };

            const createLog = async (action, details) => {
                const logData = { id: "log_" + Date.now(), timestamp: getCurrentFormattedDate() + " " + new Date().toLocaleTimeString('ms-MY'), userEmail: currentUser?.email || "Anonym", userName: currentUser?.displayName || "Pengguna", action, details };

                else setLogs(prev => [logData, ...prev]);
            };

            const checkAuth = () => {
                if (userRole === "pelawat") { showToastMessage("Akses Dihalang.", "error"); return false; } 
                if (isSystemLocked) { showToastMessage("Sistem telah dikunci oleh Admin (Mod Baca Sahaja)!", "error"); return false; }
                return true;
            };

            const houseStandings = useMemo(() => {
                const houses = {};
                Object.keys(housesMetadata).forEach(name => {
                    const meta = housesMetadata[name]; const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                    houses[name] = { emas: 0, perak: 0, gangsa: 0, keempat: 0, mata: parseInt(meta.bonusPoints)||0, warna: preset.warna, teks: preset.teks, glow: preset.glow, slogan: meta.slogan };
                });
                
                (results || []).forEach(res => {
                    const evExists = events.some(e => e.id === res.eventId);
                    if (!evExists) return; // Abaikan mata jika acara dipadam

                    let targetHouse = null;
                    if (res.athleteId && res.athleteId.startsWith("TEAM_")) {
                        targetHouse = res.athleteId.split('_')[1];
                    } else {
                        const ath = (athletes || []).find(a => a.id === res.athleteId);
                        if (ath) targetHouse = ath.rumah;
                    }

                    if (targetHouse && houses[targetHouse]) {
                        const h = houses[targetHouse];
                        if (res.kedudukan === "1") { h.emas++; h.mata += pointsConfig.emas; }
                        else if (res.kedudukan === "2") { h.perak++; h.mata += pointsConfig.perak; }
                        else if (res.kedudukan === "3") { h.gangsa++; h.mata += pointsConfig.gangsa; }
                        else if (res.kedudukan === "4") { h.keempat++; h.mata += pointsConfig.keempat; }
                    }
                });

                return Object.entries(houses).map(([nama, data]) => ({ nama, ...data })).sort((a, b) => {
                    if (b.emas !== a.emas) return b.emas - a.emas;
                    if (b.perak !== a.perak) return b.perak - a.perak;
                    if (b.gangsa !== a.gangsa) return b.gangsa - a.gangsa;
                    if (b.keempat !== a.keempat) return b.keempat - a.keempat;
                    return b.mata - a.mata;
                });
            }, [results, athletes, events, pointsConfig, housesMetadata]);

            const eventsWithCode = useMemo(() => {
                const uniqueDates = Array.from(new Set((events||[]).map(e => e.tarikh).filter(Boolean))).sort();
                return (events||[]).map((ev, idx) => {
                    const day = uniqueDates.indexOf(ev.tarikh) + 1 || 1;
                    const autoCode = `${day}${String(idx+1).padStart(2,'0')}`;
                    return { ...ev, kodAcara: ev.noAcara || autoCode };
                }).sort((a,b) => {
                    const aNum = parseInt(a.noAcara); const bNum = parseInt(b.noAcara);
                    if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
                    return (a.noAcara||"").localeCompare(b.noAcara||"") || (a.tarikh||"").localeCompare(b.tarikh||"") || (a.masa||"").localeCompare(b.masa||"");
                });
            }, [events]);

            const calculateBest = (gender, cat) => {
            if (!cat) return [];
            const catAthletes = athletes.filter(a => a.jantina === gender && (a.kategori === cat || categoriesMatch(a.kategori, cat)));
            const stats = catAthletes.map(ath => {
                let g=0, s=0, b=0, k=0, pts=0, bg=0, bs=0, bb=0;
                let senaraiAcara = [];
                results.forEach(r => {
                    const ev = events.find(e => e.id === r.eventId);
                    if (!ev) return;
                    
                    let isWinner = false;
                    if (r.athleteId === ath.id) {
                        isWinner = true;
                    } else if (ev.format === "Berkumpulan" && r.athleteId && r.athleteId.startsWith("TEAM_")) {
                        const parts = r.athleteId.split('_');
                        if (ath.rumah === parts[1] && ath.acaraIds && ath.acaraIds.includes(ev.id)) {
                            const rData = (ath.relayData && ath.relayData[ev.id]) || { pasukan: "A", pelari: "1" };
                            if (rData.pasukan === parts[2]) {
                                isWinner = true;
                            }
                        }
                    }

                    if (isWinner) {
                        let pingat = "";
                        if(r.kedudukan==="1"){g++; pts+=pointsConfig.emas; if(ev.jenis==="Balapan") bg++; pingat = "Emas";}
                            else if(r.kedudukan==="2"){s++; pts+=pointsConfig.perak; if(ev.jenis==="Balapan") bs++; pingat = "Perak";}
                            else if(r.kedudukan==="3"){b++; pts+=pointsConfig.gangsa; if(ev.jenis==="Balapan") bb++; pingat = "Gangsa";}
                            else if(r.kedudukan==="4"){k++; pts+=pointsConfig.keempat; pingat = "Ke-4";}

                            if(pingat) senaraiAcara.push({ namaAcara: ev.nama, kategori: ev.kategori, pingat: pingat, kedudukan: r.kedudukan });
                        }
                    });
                    return { ...ath, g, s, b, k, pts, bg, bs, bb, senaraiAcara };
                }).filter(a => (a.g>0||a.s>0||a.b>0||a.k>0||a.pts>0));
                
                stats.sort((x,y) => {
                    if (y.g !== x.g) return y.g - x.g;
                    if (y.s !== x.s) return y.s - x.s;
                    if (y.b !== x.b) return y.b - x.b;
                    if (y.k !== x.k) return y.k - x.k;
                    if (y.pts !== x.pts) return y.pts - x.pts;
                    if (y.bg !== x.bg) return y.bg - x.bg;
                    if (y.bs !== x.bs) return y.bs - x.bs;
                    if (y.bb !== x.bb) return y.bb - x.bb;
                    return 0;
                });
                if (stats.length === 0) return [];
                const top = stats[0];
                return stats.filter(a => a.g===top.g && a.s===top.s && a.b===top.b && a.k===top.k && a.pts===top.pts && a.bg===top.bg && a.bs===top.bs && a.bb===top.bb);
            };

            const calculateOverallBest = (gender) => {
            const catAthletes = athletes.filter(a => a.jantina === gender);
            const stats = catAthletes.map(ath => {
                let g=0, s=0, b=0, k=0, pts=0, bg=0, bs=0, bb=0;
                let senaraiAcara = [];
                results.forEach(r => {
                    const ev = events.find(e => e.id === r.eventId);
                    if (!ev) return;
                    
                    let isWinner = false;
                    if (r.athleteId === ath.id) {
                        isWinner = true;
                    } else if (ev.format === "Berkumpulan" && r.athleteId && r.athleteId.startsWith("TEAM_")) {
                        const parts = r.athleteId.split('_');
                        if (ath.rumah === parts[1] && ath.acaraIds && ath.acaraIds.includes(ev.id)) {
                            const rData = (ath.relayData && ath.relayData[ev.id]) || { pasukan: "A", pelari: "1" };
                            if (rData.pasukan === parts[2]) {
                                isWinner = true;
                            }
                        }
                    }

                    if (isWinner) {
                        let pingat = "";
                        if(r.kedudukan==="1"){g++; pts+=pointsConfig.emas; if(ev.jenis==="Balapan") bg++; pingat = "Emas";}

                            else if(r.kedudukan==="3"){b++; pts+=pointsConfig.gangsa; if(ev.jenis==="Balapan") bb++; pingat = "Gangsa";}
                            else if(r.kedudukan==="4"){k++; pts+=pointsConfig.keempat; pingat = "Ke-4";}

                            if(pingat) senaraiAcara.push({ namaAcara: ev.nama, kategori: ev.kategori, pingat: pingat, kedudukan: r.kedudukan });
                        }
                    });
                    return { ...ath, g, s, b, k, pts, bg, bs, bb, senaraiAcara };
                }).filter(a => (a.g>0||a.s>0||a.b>0||a.k>0||a.pts>0));

                stats.sort((x,y) => {
                    if (y.g !== x.g) return y.g - x.g;
                    if (y.s !== x.s) return y.s - x.s;
                    if (y.b !== x.b) return y.b - x.b;
                    if (y.k !== x.k) return y.k - x.k;
                    if (y.pts !== x.pts) return y.pts - x.pts;
                    if (y.bg !== x.bg) return y.bg - x.bg;
                    if (y.bs !== x.bs) return y.bs - x.bs;
                    if (y.bb !== x.bb) return y.bb - x.bb;
                    return 0;
                });
                if (stats.length === 0) return [];
                const top = stats[0];
                return stats.filter(a => a.g===top.g && a.s===top.s && a.b===top.b && a.k===top.k && a.pts===top.pts && a.bg===top.bg && a.bs===top.bs && a.bb===top.bb);
            };

            const uniqueEventDates = Array.from(new Set(events.map(e => e.tarikh).filter(Boolean))).sort();

            const generatePredictions = () => {
                const nextYear = (parseInt(activeYear) || new Date().getFullYear()) + 1;
                
                const getIsYear6 = (ath) => {
                    if(!ath) return false;
                    const catStr = (ath.kategori||"").toLowerCase();
                    const klsStr = (ath.kelas||"").toLowerCase();
                    if(catStr.includes('12') || klsStr.includes('6')) return true;
                    return false;
                };

                let predictedHousePoints = {};
                Object.keys(housesMetadata).forEach(name => {
                    const meta = housesMetadata[name]; 
                    predictedHousePoints[name] = { emas: 0, perak: 0, gangsa: 0, keempat: 0, mata: parseInt(meta.bonusPoints)||0 };
                });

                let predictedEvents = [];

                eventsWithCode.forEach(ev => {
                    const evResults = results.filter(r => r.eventId === ev.id).sort((a,b) => parseInt(a.kedudukan) - parseInt(b.kedudukan));
                    let remainingParticipants = [];

                    evResults.forEach(r => {

                            remainingParticipants.push({
                                originalRank: r.kedudukan,
                                house: targetHouse,
                                name: nameDisplay,
                                isTeam
                            });
                        }
                    });

                    // Re-rank 1 to 4
                    let eventPredictedWinners = [];
                    for (let i = 0; i < remainingParticipants.length && i < 4; i++) {
                        const newRank = (i + 1).toString();
                        const participant = remainingParticipants[i];
                        eventPredictedWinners.push({ ...participant, predictedRank: newRank });

                        if (participant.house && predictedHousePoints[participant.house]) {
                            const h = predictedHousePoints[participant.house];
                            if (newRank === "1") { h.emas++; h.mata += pointsConfig.emas; }
                            else if (newRank === "2") { h.perak++; h.mata += pointsConfig.perak; }
                            else if (newRank === "3") { h.gangsa++; h.mata += pointsConfig.gangsa; }
                            else if (newRank === "4") { h.keempat++; h.mata += pointsConfig.keempat; }
                        }
                    }

                    if (eventPredictedWinners.length > 0) {
                        predictedEvents.push({ event: ev, winners: eventPredictedWinners });
                    }
                });

                const sortedHouses = Object.entries(predictedHousePoints).map(([nama, data]) => {

                    return { nama, ...data, warna: preset.warna, teks: preset.teks, glow: preset.glow };
                }).sort((a, b) => {
                    if (b.emas !== a.emas) return b.emas - a.emas;
                    if (b.perak !== a.perak) return b.perak - a.perak;
                    if (b.gangsa !== a.gangsa) return b.gangsa - a.gangsa;
                    if (b.keempat !== a.keempat) return b.keempat - a.keempat;
                    return b.mata - a.mata;
                });

                            if (data.events) for (const ev of data.events) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('events').doc(ev.id).set(ev);
                            if (data.records) for (const rec of data.records) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('records').doc(rec.id).set(rec);
                        }

                };

                            <div class="lt-legend">PETUNJUK: [ O ] Sah | [ X ] Gagal | [ - ] Pass</div>
                            <table class="lt-main-table">
                                <thead>
                                    <tr>
                                        <th rowspan="2" style="width: 30px;">BIL</th>
                                        <th rowspan="2" style="width: 45px;">NO.<br>PES.</th>
                                        <th rowspan="2" style="text-align: left; padding-left: 8px;">NAMA PESERTA</th>
                                        <th rowspan="2" style="width: 65px;">PASUKAN</th>
                                        <th colspan="5">KETINGGIAN PALANG (m)</th>
                                        <th rowspan="2" style="width: 65px;">TERBAIK</th>
                                        <th rowspan="2" style="width: 65px;">KED.</th>
                                    </tr>
                                    <tr><th style="height: 22px;"></th><th></th><th></th><th></th><th></th></tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                            <div class="lt-footer">
                                <div class="lt-rules"><strong>Countback:</strong><ol><li>Jumlah kegagalan (X) paling sedikit pada ketinggian pemenang.</li><li>Jumlah kegagalan (X) keseluruhan paling sedikit.</li></ol></div>
                                <div class="lt-sigs">
                                    <div class="lt-sig-box"><div class="lt-sig-line"></div>KETUA HAKIM</div>
                                    <div class="lt-sig-box"><div class="lt-sig-line"></div>REFERI</div>
                                    <div class="lt-sig-box"><div class="lt-sig-line"></div>PENCATAT</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (mode === 'sijil') {
                    const athResults = results.filter(r => {
                        if (r.athleteId === targetData.id) return true;
                        if (r.athleteId && r.athleteId.startsWith("TEAM_")) {
                            const ev = events.find(e => e.id === r.eventId);
                            if (ev && ev.format === "Berkumpulan") {
                                const parts = r.athleteId.split('_');
                                if (targetData.rumah === parts[1] && targetData.acaraIds && targetData.acaraIds.includes(ev.id)) {
                                    const rData = (targetData.relayData && targetData.relayData[ev.id]) || { pasukan: "A", pelari: "1" };
                                    if (rData.pasukan === parts[2]) return true;
                                }
                            }
                        }
                        return false;
                    }).filter(r => ["1","2","3"].includes(r.kedudukan));
                    const hasWon = athResults.length > 0;
                    const certTitle = hasWon ? "SIJIL PENCAPAIAN" : "SIJIL PENGHARGAAN";
                    
                    let achievementText = "";
                    let plainTextForShare = `Tahniah ${targetData.nama} (Rumah ${targetData.rumah}) atas penyertaan dengan semangat kesukanan yang cemerlang dalam ${activeSchoolSubtitle} ${activeYear}!`;

                    if (hasWon) {
                        const medals = athResults.map(r => {
                            const ev = events.find(e => e.id === r.eventId);
                            const medalName = r.kedudukan === "1" ? "Emas" : r.kedudukan === "2" ? "Perak" : "Gangsa";
                            return `${medalName} dalam acara ${ev ? ev.nama : "Tidak Diketahui"}`;
                        });
                        achievementText = `<p style="font-size: 15px; font-weight: bold; color: #1e3a8a; margin: 15px 0; line-height: 1.5;">Tahniah, kerana telah memenangi pingat:<br>${medals.join('<br>')}</p>`;
                        
                        const medalsShare = athResults.map(r => {
                            const ev = events.find(e => e.id === r.eventId);
                            const medalName = r.kedudukan === "1" ? "Emas" : r.kedudukan === "2" ? "Perak" : "Gangsa";
                            return `${medalName} (${ev ? ev.nama : "Acara"})`;
                        });
                        plainTextForShare = `Tahniah ${targetData.nama} (Rumah ${targetData.rumah})! Anda telah berjaya memenangi pingat ${medalsShare.join(', ')} di ${activeSchoolSubtitle} ${activeYear}! 🎉`;
                    } else {
                        achievementText = `<p style="font-size: 16px; line-height: 1.6; max-width: 600px; margin: 0 auto 25px auto;">Telah mempamerkan semangat kesukanan yang tinggi dan mengambil bahagian dengan cemerlang.</p>`;
                    }
                    
                    setShareText(plainTextForShare);

                    printContent = `
                        <div style="border: 12px double #1e3a8a; padding: 35px; text-align: center; font-family: 'Playfair Display', serif; min-height: 240mm; box-sizing: border-box; position: relative;">
                            <img src="${logoUrl}" style="height: 90px; margin-bottom: 15px;" onerror="this.style.display='none'"/>
                            <h1 style="font-size: 26px; font-weight: 800; color: #1e3a8a; margin: 0;">${activeSchoolName}</h1>
                            <div style="height: 2px; width: 100px; background: #fbbf24; margin: 20px auto;"></div>
                            <h2 style="font-size: 32px; font-weight: 700; color: #b45309;">${certTitle}</h2>
                            <p style="font-size: 15px; margin: 25px 0;">Dengan ini diperakui bahawa</p>
                            <h3 style="font-size: 24px; font-weight: bold; text-decoration: underline; margin: 10px 0;">${targetData.nama.toUpperCase()}</h3>
                            <p style="font-size: 13px; color: #334155; margin-bottom: 15px;">
                                Rumah: <strong>Rumah ${targetData.rumah}</strong> | Kelas: <strong>${targetData.kelas}</strong>
                            </p>
                            ${achievementText}
                            <p style="font-size: 15px; margin: 15px 0 40px 0;">Semasa ${activeSchoolSubtitle} Tahun ${activeYear}.</p>
                            
                            <div style="margin-top: 50px; font-family: sans-serif; font-size: 11px; display: flex; justify-content: space-around;">
                                ${certShowSignatory1 ? `
                                <div style="width: 30%; text-align: center;">
                                    <div style="border-bottom: 1px solid #000; width: 100%; margin: 0 auto;"></div>
                                    <p style="margin: 6px 0 0 0; font-weight: bold; text-transform: uppercase;">${certSignatory1Name}</p>
                                    <p style="margin: 0; color: #64748b;">${certSignatory1Title}</p>
                                </div>` : ''}
                                ${certShowSignatory2 ? `
                                <div style="width: 30%; text-align: center;">
                                    <div style="border-bottom: 1px solid #000; width: 100%; margin: 0 auto;"></div>
                                    <p style="margin: 6px 0 0 0; font-weight: bold; text-transform: uppercase;">${certSignatory2Name}</p>
                                    <p style="margin: 0; color: #64748b;">${certSignatory2Title}</p>
                                </div>` : ''}
                                ${certShowSignatory3 ? `
                                <div style="width: 30%; text-align: center;">
                                    <div style="border-bottom: 1px solid #000; width: 100%; margin: 0 auto;"></div>
                                    <p style="margin: 6px 0 0 0; font-weight: bold; text-transform: uppercase;">${certSignatory3Name}</p>
                                    <p style="margin: 0; color: #64748b;">${certSignatory3Title}</p>
                                </div>` : ''}
                            </div>
                        </div>
                    `;
                }
                
                const isLandscape = (mode === 'hakim_lompat_tinggi');
                setPreviewContent(`
                    <!DOCTYPE html>
                    <html lang="ms">
                    <head>
                        <meta name="viewport" content="width=${isLandscape ? 1123 : 794}">
                        <style>
                            html, body { background: #cbd5e1; margin: 0; padding: 0; font-family: sans-serif; }
                            .preview-container { padding: 20px; display: flex; justify-content: center; min-width: max-content; }
                            .a4-page {
                                background: white;
                                width: ${isLandscape ? '1123px' : '794px'};
                                min-height: ${isLandscape ? '794px' : '1123px'};
                                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                                box-sizing: border-box;
                                padding: ${isLandscape ? '10mm' : '15mm'};
                                position: relative;
                            }
                            @media print { 
                                html, body { background: white; padding: 0; margin: 0; }
                                .preview-container { padding: 0; display: block; min-width: auto; }
                                .a4-page { width: 100%; min-height: auto; box-shadow: none; padding: 0; }
                                @page { size: A4 ${isLandscape ? 'landscape' : 'portrait'}; margin: ${isLandscape ? '10mm' : '10mm'}; }
                            }
                        </style>
                    </head>
                    <body>
                        <div class="preview-container">
                            <div class="a4-page">
                                ${printContent}
                            </div>
                        </div>
                    </body>
                    </html>
                `);
                setIsPreviewModalOpen(true);
            };

            const handleSaveKokumManualToCloud = async () => {
                if(!checkAuth()) return;
                const f = document.getElementById('preview-frame');
                if (f && f.contentWindow && f.contentWindow.document) {
                    const editableDiv = f.contentWindow.document.getElementById('kokum-manual-laporan');
                    if (editableDiv) {
                        const content = editableDiv.innerHTML;
                        localStorage.setItem('sps_kokum_manual', content);
                        setKokumManualText(content);

                        if (gasUrl) {
                            try {
                                showToastMessage("Menyimpan ke Google Sheets...", "info");
                                const response = await fetch(gasUrl, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ action: 'saveKokumManual', content, year: activeYear })
                                });
                                showToastMessage("Laporan manual berjaya disimpan ke Google Sheets!");
                            } catch (err) {
                                console.error(err);
                                showToastMessage("Disimpan secara lokal. Gagal hubungkan ke Google Sheets.", "error");
                            }
                        } else {
                            showToastMessage("Maklumat tambahan laporan disimpan secara lokal!");
                        }
                    }
                }
            };

            const handleHouseSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                const updated = { ...housesMetadata };
                const newObj = { slogan: houseForm.slogan, guruPenasihat: houseForm.guruPenasihat, bonusPoints: houseForm.bonusPoints, warnaLabel: houseForm.warnaLabel };
                if (isEditingHouse && originalHouseKey !== houseForm.nama) delete updated[originalHouseKey];
                updated[houseForm.nama] = newObj;
                
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('metadata').doc('houses').set(updated);
                else setHousesMetadata(updated);
                
                setIsHouseSidebarOpen(false); showToastMessage("Rumah sukan disimpan!");
            };

            const handleEventSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                const id = eventForm.id || "E_" + Date.now();
                const evData = { ...eventForm, id };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('events').doc(id).set(evData);
                else setEvents(prev => isEditingEvent ? prev.map(x => x.id === id ? evData : x) : [...prev, evData]);
                setIsEventSidebarOpen(false); showToastMessage("Acara disimpan!");
            };

            const handleAthleteSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                if (!athleteForm.nama || athleteForm.nama.trim() === "") { showToastMessage("Sila pastikan ruangan nama tidak kosong.", "error"); return; }
                const id = athleteForm.id || "A_" + Date.now();
                const athData = { ...athleteForm, id, nama: athleteForm.nama.trim().toUpperCase() };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(id).set(athData);
                else setAthletes(prev => isEditingAthlete ? prev.map(x => x.id === id ? athData : x) : [...prev, athData]);
                setIsAddAthleteSidebarOpen(false); showToastMessage("Atlet disimpan!");
            };

            const handleBulkImportSubmit = async (e) => {
                e.preventDefault();
                if (!checkAuth()) return;
                if (!bulkText.trim()) { showToastMessage("Sila masukkan senarai nama atlet.", "error"); return; }
                
                const lines = bulkText.split('\n').filter(line => line.trim() !== "");
                let addedCount = 0;
                let newAthletesList = [...athletes];

                for (const line of lines) {
                    const parts = line.split(/[,|\t]/).map(p => p.trim());
                    if (parts.length >= 1 && parts[0] !== "") {
                        const nama = parts[0].toUpperCase();
                        const kelas = parts[1] ? parts[1].toUpperCase() : "6 AMANAH";
                        const rawJantina = parts[2] ? parts[2].toLowerCase() : "lelaki";
                        const jantina = (rawJantina.startsWith('p') || rawJantina.startsWith('f')) ? "Perempuan" : "Lelaki";
                        const kategori = parts[3] ? parts[3].toUpperCase() : categories[0];

                        let rumahParsed = bulkHouse;
                        if (parts[4]) {
                            const rawR = parts[4].trim();
                            rumahParsed = rawR.charAt(0).toUpperCase() + rawR.slice(1).toLowerCase();
                            if (!housesMetadata[rumahParsed]) {
                                const matched = Object.keys(housesMetadata).find(k => k.toLowerCase() === rawR.toLowerCase());
                                if (matched) rumahParsed = matched;
                            }
                        }

                        const id = "A_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
                        const athData = { id, nama, kelas, rumah: rumahParsed, jantina, kategori, acaraIds: [], relayData: {} };

                        newAthletesList.push(athData);
                        if (isCloudActive && db) {
                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(id).set(athData);
                        }
                        addedCount++;
                    }
                }

                if (!isCloudActive) {
                    setAthletes(newAthletesList);
                }

                createLog("Import Pukal Atlet", `Berjaya menambah ${addedCount} orang atlet ke Rumah ${bulkHouse}`);
                showToastMessage(`Berjaya mendaftarkan ${addedCount} orang atlet secara pukal!`);
                setIsBulkModalOpen(false);
                setBulkText("");
            };

            const handleResultSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                if (!resultForm.eventId || !resultForm.athleteId) return;
                const id = "R_" + Date.now();
                const resData = { ...resultForm, id };
                
                if (isCloudActive && db) {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('results').doc(id).set(resData);
                    await createLog("Kunci Keputusan", `Atlet ID ${resultForm.athleteId} mendapat kedudukan ${resultForm.kedudukan} untuk acara ${resultForm.eventId}`);
                }
                else setResults(prev => [...prev, resData]);
                setResultForm(prev => ({...prev, athleteId: "", catatan: ""})); showToastMessage("Keputusan disimpan!");
            };

            const handleRecordSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                const id = recordForm.id || "REC_" + Date.now();
                const recData = { ...recordForm, id };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('records').doc(id).set(recData);
                else setRecords(prev => recordForm.id ? prev.map(x => x.id === id ? recData : x) : [...prev, recData]);
                setShowRecordForm(false); showToastMessage("Rekod disimpan ke arkib!");
            };

            const TABS = [
                { id: "dashboard", label: "Papan Pemuka", reqRoles: ["admin", "guru", "urusetia", "pelawat"] },
                { id: "rumah_sukan", label: "Rumah Sukan", reqRoles: ["admin", "guru", "urusetia"] },
                { id: "acara", label: "Pengurusan Acara", reqRoles: ["admin", "guru", "urusetia"] },
                { id: "atlit", label: "Pengurusan Atlet", reqRoles: ["admin", "guru", "urusetia"] },
                { id: "keputusan", label: "Keputusan Acara", reqRoles: ["admin", "guru", "urusetia", "pelawat"] },
                { id: "ramalan", label: "Ramalan Hadapan", reqRoles: ["admin"] },
                { id: "pasca_sukan", label: "Pasca Sukan", reqRoles: ["admin", "guru", "urusetia"] }
            ].filter(tab => tab.reqRoles.includes(userRole));

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <input type="file" ref={fileInputRef} onChange={handleRestoreBackup} accept=".json" className="hidden" />
                    
                    {isSystemLocked && (
                        <div className="bg-red-600 text-white text-center py-1.5 px-4 text-[11px] font-bold tracking-widest uppercase shadow-md sticky top-0 z-[100]">
                            ⚠️ Sistem Telah Dikunci (Mod Baca Sahaja)
                        </div>
                    )}

                    <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-md relative z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <img src={logoUrl} alt="Logo Sekolah" className="h-16 w-16 object-contain drop-shadow-md" onError={(e) => e.target.style.display='none'} />
                                <div>
                                    <h1 className="text-xl font-extrabold tracking-tight">SPARK Online <span className="text-xl font-extrabold text-indigo-300">- Transformasi Digital dalam Pengurusan Sukan</span></h1>
                                    <p className="text-xs font-semibold text-indigo-200">{activeSchoolName} ({activeYear})</p>
                                </div>
                            </div>
                            
                            <div className="flex flex-wrap items-center gap-2">
                                {userRole === "admin" && (
                                    <div className="relative inline-block" ref={adminMenuRef}>
                                        <button onClick={() => setIsAdminMenuOpen(!isAdminMenuOpen)} className="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-black px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 shadow-sm">🛠️ PANEL PENTADBIR</button>
                                        {isAdminMenuOpen && (
                                            <div className="absolute left-0 mt-2 w-[260px] max-w-[95vw] bg-white rounded-2xl shadow-2xl border py-2 text-slate-800 z-[9999] overflow-hidden">
                                                <button onClick={() => { setShowLockModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-red-50 text-xs font-semibold text-red-700">🔒 Kunci Sistem (Read-Only)</button>
                                                <button onClick={() => { setShowDiagModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-slate-50 text-xs font-semibold">ℹ️ Info Diag</button>
                                                <button onClick={() => { setShowAdminManagerModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-slate-50 text-xs font-semibold">👥 Pengurusan Admin Tambahan</button>
                                                <button onClick={() => { setShowPointsModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-slate-50 text-xs font-semibold">⚙️ Tetapan Kategori & Mata</button>
                                                <button onClick={() => { setShowSchoolSetupModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-slate-50 text-xs font-semibold">🏫 Tetapan Sekolah Baharu</button>
                                                <button onClick={() => { handleBackup(); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-emerald-50 text-xs font-semibold text-emerald-700">📥 Sandaran Data (JSON)</button>
                                                <button onClick={() => { handleRestoreClick(); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-amber-50 text-xs font-semibold text-amber-700">📤 Muat Naik Sandaran</button>
                                                <button onClick={() => { handleResetDatabase(); setIsAdminMenuOpen(false); }} className="w-full text-left px-5 py-2.5 hover:bg-red-50 text-xs font-semibold text-red-600">🔄 Kosongkan DB</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                                {currentUser && !currentUser.isAnonymous ? (
                                    <div className="flex items-center gap-2 bg-slate-800 p-1.5 pl-3 pr-2 rounded-xl text-xs shadow-inner">
                                        <div>
                                            <p className="font-bold text-white">{currentUser.displayName || "Pengguna"}</p>
                                            <p className="text-[9px] font-bold text-emerald-400 uppercase">{userRole}</p>
                                        </div>
                                        <button onClick={() => { auth?.signOut(); localStorage.clear(); window.location.reload(); }} className="text-red-400 hover:text-red-300 font-bold ml-2">Keluar</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setIsLoginModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-xl font-bold text-xs shadow-md">Log Masuk</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <nav className="bg-white border-b sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-2 flex overflow-x-auto space-x-2">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all ${activeTab === tab.id ? "bg-indigo-600 text-white shadow-md scale-105" : "text-slate-600 hover:bg-slate-100"}`}>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 w-full flex-grow">
                        
                        {}
                        {activeTab === "dashboard" && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {houseStandings.map((h, i) => (
                                        <div key={h.nama} className={`bg-white border p-4 rounded-2xl relative overflow-hidden transition-all duration-300 ${h.glow}`}>
                                            <div className={`absolute top-0 left-0 w-full h-1.5 ${h.warna}`}></div>
                                            <div className="flex justify-between items-start">
                                                <div><span className="text-[10px] font-bold text-slate-400 uppercase">Kedudukan #{i+1}</span><h3 className="font-black text-lg">Rumah {h.nama}</h3></div>
                                                <span className={`text-2xl font-black ${h.teks}`}>{h.mata}</span>
                                            </div>
                                            <div className="grid grid-cols-4 gap-2 mt-4 text-center text-xs font-bold bg-slate-50 p-3 rounded-xl items-end">
                                                <div><span className="text-3xl block mb-1 drop-shadow-sm hover:scale-110 transition">🥇</span>{h.emas}</div>
                                                <div><span className="text-3xl block mb-1 drop-shadow-sm hover:scale-110 transition">🥈</span>{h.perak}</div>
                                                <div><span className="text-3xl block mb-1 drop-shadow-sm hover:scale-110 transition">🥉</span>{h.gangsa}</div>
                                                <div><span className="text-3xl block mb-1 drop-shadow-sm hover:scale-110 transition">🏅</span>{h.keempat}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="bg-white p-5 border rounded-2xl h-[400px] flex flex-col shadow-sm">
                                        <div className="flex justify-between items-center border-b pb-2 mb-3 shrink-0">
                                            <h3 className="font-bold">📢 Hebahan Semasa</h3>
                                            {userRole !== "pelawat" && <button onClick={() => setShowAnnounceForm(!showAnnounceForm)} className="text-xs bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-100 transition">+ Hebahan</button>}
                                        </div>
                                        {showAnnounceForm && (
                                            <form onSubmit={(e) => {
                                                e.preventDefault();
                                                if(!checkAuth()) return;
                                                const ann = { id: "ann_"+Date.now(), text: announceFormText, date: getCurrentFormattedDate(), author: currentUser?.displayName || "Pentadbir" };
                                                if (isCloudActive && db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('announcements').doc(ann.id).set(ann);
                                                else setAnnouncements([ann, ...announcements]);

                                                                            show: true, title: "Padam Atlet", message: `Padam ${ath.nama}?`,
                                                                            onConfirm: () => {
                                                                                if (isCloudActive && db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(ath.id).delete();
                                                                                else setAthletes(athletes.filter(a => a.id !== ath.id));
                                                                                setConfirmModal({ show: false, title: "", message: "", onConfirm: null });
                                                                                showToastMessage("Atlet dipadam.");
                                                                            }
                                                                        });
                                                                    }} className="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">Padam</button>
                                                                </>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {isPreviewModalOpen && (
                        <div className="fixed inset-0 z-[10000] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 md:p-8 animate-fade-in">
                            <div className="bg-slate-100 w-full max-w-5xl h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden relative">
                                <div className="flex-1 w-full bg-slate-300/50 p-2 sm:p-6 overflow-hidden relative flex justify-center">
                                    <iframe id="preview-frame" srcDoc={previewContent} className="w-full h-full border-none sm:rounded-xl shadow-lg relative z-10" />
                                </div>
                                <div className="p-4 bg-white flex justify-end gap-3 text-xs font-bold border-t z-10">
                                    {currentPrintMode === 'kokum' && (
                                        <button onClick={handleSaveKokumManualToCloud} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl shadow-lg transition mr-auto">
                                            💾 Simpan Laporan Manual
                                        </button>
                                    )}
                                    <button onClick={()=>setIsPreviewModalOpen(false)} className="bg-slate-200 hover:bg-slate-300 px-6 py-3 rounded-xl transition">Tutup</button>
                                    <button onClick={()=>{const f=document.getElementById('preview-frame');if(f){f.contentWindow.focus();f.contentWindow.print();}}} className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl shadow-lg transition">Cetak Dokumen</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast.show && (
                        <div className="fixed bottom-6 right-6 z-[10001] bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-3 animate-slide-up">
                            {toast.type === "error" ? "⚠️" : "✅"}
                            <span>{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
