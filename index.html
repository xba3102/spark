    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAJ5LrENOSzRkClehZmu3dy3JKrt6QvtcU", authDomain: "sps-skb-d8256.firebaseapp.com",
            projectId: "sps-skb-d8256", storageBucket: "sps-skb-d8256.firebasestorage.app",
            messagingSenderId: "322634427088", appId: "1:322634427088:web:7f6858760d588e49190cd5"
        };
        const DEFAULT_SCHOOL_NAME = "SK BIKANG";
        const DEFAULT_SCHOOL_SUBTITLE = "Kejohanan Sukan Tahunan Sekolah";
        const DEFAULT_SCHOOL_LOGO = "https://lh3.googleusercontent.com/d/1E8tjAd7j9DJaZgngDn38agUFCvwyUffa";

        let activeFirebaseConfig = DEFAULT_FIREBASE_CONFIG;
        const cachedConfigRaw = localStorage.getItem('sps_custom_firebase_config');
        if (cachedConfigRaw) {
            try { activeFirebaseConfig = JSON.parse(cachedConfigRaw); } catch (e) { console.error(e); }
        }

        let db = null; let auth = null; let isCloudAvailable = false;
        if (typeof firebase !== 'undefined') {
            try {
                if (!firebase.apps.length) firebase.initializeApp(activeFirebaseConfig);
                auth = firebase.auth(); db = firebase.firestore(); isCloudAvailable = true;
            } catch (err) { console.warn("Lokal:", err); }
        }
        const appId = activeFirebaseConfig.projectId || "sps-skb-d8256";

        const COLOR_PRESETS = {
            Merah: { bg: "bg-red-100", text: "text-red-700", warna: "bg-red-500", teks: "text-red-600", glow: "hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] border-red-200" },
            Biru: { bg: "bg-blue-100", text: "text-blue-700", warna: "bg-blue-500", teks: "text-blue-600", glow: "hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] border-blue-200" },
            Hijau: { bg: "bg-emerald-100", text: "text-emerald-700", warna: "bg-emerald-500", teks: "text-emerald-600", glow: "hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] border-emerald-200" },
            Kuning: { bg: "bg-amber-100", text: "text-amber-700", warna: "bg-amber-400", teks: "text-amber-500", glow: "hover:shadow-[0_0_20px_rgba(251,191,36,0.4)] border-amber-200" },
            Ungu: { bg: "bg-purple-100", text: "text-purple-700", warna: "bg-purple-500", teks: "text-purple-600", glow: "hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] border-purple-200" },
            Oren: { bg: "bg-orange-100", text: "text-orange-700", warna: "bg-orange-500", teks: "text-orange-600", glow: "hover:shadow-[0_0_20px_rgba(249,115,22,0.4)] border-orange-200" }
        };

        const INITIAL_HOUSES = {
            Merah: { slogan: "Saga Membara", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Merah" },
            Biru: { slogan: "Biru Gagah", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Biru" },
            Hijau: { slogan: "Hijau Perkasa", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Hijau" },
            Kuning: { slogan: "Kuning Diraja", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Kuning" }
        };

        const formatDateToDMY = (dateStr) => {
            if (!dateStr) return "N/A";
            const parts = dateStr.split('-');
            return parts.length === 3 ? (parts[0].length === 4 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dateStr) : dateStr;
        };

        const getCurrentFormattedDate = () => {
            const d = new Date();
            return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
        };

        const categoriesMatch = (athCat, evCat) => {
            if (!athCat || !evCat) return false;
            const a = athCat.trim().toUpperCase().replace(/\s+/g, '');
            const e = evCat.trim().toUpperCase().replace(/\s+/g, '');
            if (a === e || e === "TERBUKA" || e === "KESELURUHAN") return true;

            const parseCat = (cat) => {
                const jantina = cat.startsWith('L') ? 'L' : (cat.startsWith('P') ? 'P' : null);
                const umurMatch = cat.match(/\d+/);
                const umur = umurMatch ? parseInt(umurMatch[0]) : 99;
                return { jantina, umur };
            };

            const aParsed = parseCat(a); const eParsed = parseCat(e);
            if (aParsed.jantina && eParsed.jantina && aParsed.jantina !== eParsed.jantina) return false;
            
            if (e.includes("TKB")) {
                return aParsed.umur <= eParsed.umur && aParsed.umur >= eParsed.umur - 2;
            } else if (e.includes("BAWAH") || e.includes("B") || e.includes("U")) {
                if (aParsed.umur <= eParsed.umur) return true;
            }
            return aParsed.umur === eParsed.umur;
        };

        const App = () => {
            const [userRole, setUserRole] = useState("pelawat");
            const [currentUser, setCurrentUser] = useState(null);
            const [isCloudActive, setIsCloudActive] = useState(false);
            const [activeTab, setActiveTab] = useState("dashboard"); 
            
            const [athletes, setAthletes] = useState([]);
            const [events, setEvents] = useState([]);
            const [results, setResults] = useState([]);
            const [heats, setHeats] = useState([]);
            const [housesMetadata, setHousesMetadata] = useState(INITIAL_HOUSES);
            const [announcements, setAnnouncements] = useState([]);
            const [logs, setLogs] = useState([]);
            const [adminList, setAdminList] = useState([]);
            const [records, setRecords] = useState([]); 
            const [categories, setCategories] = useState(["L12TKB", "P12TKB", "L10TKB", "P10TKB", "Prasekolah", "Terbuka"]);

            const [activeYear, setActiveYear] = useState(() => localStorage.getItem('sps_active_year') || new Date().getFullYear().toString());
            const [maxIndividu, setMaxIndividu] = useState(() => parseInt(localStorage.getItem('sps_max_individu')) || 3);
            const [maxKumpulan, setMaxKumpulan] = useState(() => parseInt(localStorage.getItem('sps_max_kumpulan')) || 2);
            const [pointsConfig, setPointsConfig] = useState({ emas: 5, perak: 3, gangsa: 2, keempat: 1 });
            const [gasUrl, setGasUrl] = useState(localStorage.getItem('sps_custom_gas_url') || "");

            const [isSystemLocked, setIsSystemLocked] = useState(false);
            const [lockConfig, setLockConfig] = useState({ isLocked: false, autoLockDate: "" });
            const [showLockModal, setShowLockModal] = useState(false);

            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
            const [isAdminMenuOpen, setIsAdminMenuOpen] = useState(false);
            const [showPointsModal, setShowPointsModal] = useState(false);
            const [showSchoolSetupModal, setShowSchoolSetupModal] = useState(false);
            const [showDiagModal, setShowDiagModal] = useState(false);
            const [showAdminManagerModal, setShowAdminManagerModal] = useState(false);
            const [newAdminEmail, setNewAdminEmail] = useState("");
            
            const [certSignatory1Name, setCertSignatory1Name] = useState(() => localStorage.getItem('sps_sig1_name') || "SITI NURHALIZA");
            const [certSignatory1Title, setCertSignatory1Title] = useState(() => localStorage.getItem('sps_sig1_title') || "Setiausaha Sukan");
            const [certSignatory2Name, setCertSignatory2Name] = useState(() => localStorage.getItem('sps_sig2_name') || "AHMAD ALBAB");
            const [certSignatory2Title, setCertSignatory2Title] = useState(() => localStorage.getItem('sps_sig2_title') || "Penolong Kanan Kokurikulum");
            const [certSignatory3Name, setCertSignatory3Name] = useState(() => localStorage.getItem('sps_sig3_name') || "ADAM CORRIE");
            const [certSignatory3Title, setCertSignatory3Title] = useState(() => localStorage.getItem('sps_sig3_title') || "Guru Besar");
            const [certShowSignatory1, setCertShowSignatory1] = useState(() => localStorage.getItem('sps_sig1_show') !== 'false');
            const [certShowSignatory2, setCertShowSignatory2] = useState(() => localStorage.getItem('sps_sig2_show') !== 'false');
            const [certShowSignatory3, setCertShowSignatory3] = useState(() => localStorage.getItem('sps_sig3_show') !== 'false');

            const [athleteForm, setAthleteForm] = useState({ id: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12TKB" });
            const [isAddAthleteSidebarOpen, setIsAddAthleteSidebarOpen] = useState(false);
            const [isEditingAthlete, setIsEditingAthlete] = useState(false);
            
            const [isBulkModalOpen, setIsBulkModalOpen] = useState(false);
            const [bulkText, setBulkText] = useState("");
            const [bulkHouse, setBulkHouse] = useState("Merah");

            const [eventForm, setEventForm] = useState({ id: "", noAcara: "", nama: "", kategori: "L12TKB", jenis: "Balapan", format: "Individu", tarikh: "", masa: "" });
            const [isEventSidebarOpen, setIsEventSidebarOpen] = useState(false);
            const [isEditingEvent, setIsEditingEvent] = useState(false);

            const [houseForm, setHouseForm] = useState({ nama: "", slogan: "", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Ungu" });
            const [isHouseSidebarOpen, setIsHouseSidebarOpen] = useState(false);
            const [isEditingHouse, setIsEditingHouse] = useState(false);
            const [originalHouseKey, setOriginalHouseKey] = useState("");
            const [showMembersModal, setShowMembersModal] = useState(false);
            const [selectedMembersHouse, setSelectedMembersHouse] = useState("");

            const [athleteSearchQuery, setAthleteSearchQuery] = useState("");
            const [isEventRegModalOpen, setIsEventRegModalOpen] = useState(false);
            const [activeRegEvent, setActiveRegEvent] = useState(null);
            const [regModalHouseFilter, setRegModalHouseFilter] = useState("Semua");
            const [regModalCategoryFilter, setRegModalCategoryFilter] = useState("Semua");

            const [resultForm, setResultForm] = useState({ eventId: "", athleteId: "", kedudukan: "1", catatan: "" });
            const [announceFormText, setAnnounceFormText] = useState("");
            const [showAnnounceForm, setShowAnnounceForm] = useState(false);
            const [selectedEventDate, setSelectedEventDate] = useState("Semua");
            
            const [bestAthleteMaleCat, setBestAthleteMaleCat] = useState("");
            const [bestAthleteFemaleCat, setBestAthleteFemaleCat] = useState("");

            const [kokumManualText, setKokumManualText] = useState(() => localStorage.getItem('sps_kokum_manual') || `<b>1. Kehadiran Tetamu / Jemputan:</b><br><br><br><b>2. Kewangan & Perbelanjaan:</b><br><br><br><b>3. Kekuatan Program:</b><br><br><br><b>4. Isu / Cabaran & Cadangan Penambahbaikan:</b><br><br><br>`);
            const [currentPrintMode, setCurrentPrintMode] = useState("");
            const [shareText, setShareText] = useState("");

            const [previewContent, setPreviewContent] = useState("");
            const [isPreviewModalOpen, setIsPreviewModalOpen] = useState(false);
            const [toast, setToast] = useState({ show: false, message: "", type: "info" });
            const [confirmModal, setConfirmModal] = useState({ show: false, title: "", message: "", onConfirm: null });

            const adminMenuRef = useRef(null);
            const fileInputRef = useRef(null);

            const activeSchoolName = localStorage.getItem('sps_school_name') || DEFAULT_SCHOOL_NAME;
            const activeSchoolSubtitle = localStorage.getItem('sps_school_subtitle') || DEFAULT_SCHOOL_SUBTITLE;
            const logoUrl = localStorage.getItem('sps_school_logo') || DEFAULT_SCHOOL_LOGO;

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (adminMenuRef.current && !adminMenuRef.current.contains(event.target)) {
                        setIsAdminMenuOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            useEffect(() => {
                if (!isCloudAvailable || !auth) { setIsCloudActive(false); return; }
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) { setCurrentUser(user); setIsCloudActive(true); } 
                    else {
                        const cRole = localStorage.getItem('sps_local_role');
                        if (cRole) {
                            setCurrentUser({ displayName: localStorage.getItem('sps_local_name') || (cRole === 'urusetia' ? "Urusetia" : "Pentadbir"), email: localStorage.getItem('sps_local_email') });
                            setUserRole(cRole); setIsCloudActive(true);
                        } else { setCurrentUser(null); setUserRole("pelawat"); }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                let isLockedNow = lockConfig.isLocked === true;
                if (!isLockedNow && lockConfig.autoLockDate) {
                    const lockTime = new Date(lockConfig.autoLockDate).getTime();
                    if (!isNaN(lockTime) && new Date().getTime() >= lockTime) {
                        isLockedNow = true;
                    }
                }
                setIsSystemLocked(isLockedNow);

                const interval = setInterval(() => {
                    if (lockConfig.isLocked) return; 
                    if (lockConfig.autoLockDate) {
                        const lockTime = new Date(lockConfig.autoLockDate).getTime();
                        if (!isNaN(lockTime) && new Date().getTime() >= lockTime) {
                            setIsSystemLocked(true);
                        } else {
                            setIsSystemLocked(false);
                        }
                    }
                }, 10000); 

                return () => clearInterval(interval);
            }, [lockConfig]);

            useEffect(() => {
                if (!isCloudActive || !db) return;
                const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubAth = base.collection('athletes').onSnapshot(snap => setAthletes(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubEv = base.collection('events').onSnapshot(snap => setEvents(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubRes = base.collection('results').onSnapshot(snap => setResults(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubHeat = base.collection('heats').onSnapshot(snap => setHeats(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubRec = base.collection('records').onSnapshot(snap => setRecords(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubAnn = base.collection('announcements').onSnapshot(snap => {
                    const a = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    a.sort((x,y) => y.id.localeCompare(x.id)); setAnnouncements(a);
                });
                const unsubLog = base.collection('logs').onSnapshot(snap => {
                    const l = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    l.sort((x,y) => y.id.localeCompare(x.id)); setLogs(l);
                });
                const unsubMeta = base.collection('metadata').doc('houses').onSnapshot(doc => { 
                    if (doc.exists) {
                        const fetchedData = doc.data();
                        const mergedHouses = { ...INITIAL_HOUSES };
                        Object.keys(fetchedData).forEach(key => { mergedHouses[key] = fetchedData[key]; });
                        setHousesMetadata(mergedHouses);
                    } else { setHousesMetadata(INITIAL_HOUSES); }
                });
                const unsubConf = base.collection('metadata').doc('config').onSnapshot(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        if (d.categories) { setCategories(d.categories); }
                        if (d.maxIndividu !== undefined) setMaxIndividu(d.maxIndividu);
                        if (d.maxKumpulan !== undefined) setMaxKumpulan(d.maxKumpulan);
                        if (d.activeYear) setActiveYear(d.activeYear);
                    }
                });
                const unsubPts = base.collection('metadata').doc('points').onSnapshot(doc => { if(doc.exists) setPointsConfig(doc.data()); });
                const unsubAdmins = base.collection('metadata').doc('admins').onSnapshot(doc => { if(doc.exists) setAdminList(doc.data().list || []); });
                const unsubLock = base.collection('metadata').doc('systemLock').onSnapshot(doc => { if(doc.exists) setLockConfig(doc.data()); });

                return () => { unsubAth(); unsubEv(); unsubRes(); unsubHeat(); unsubRec(); unsubAnn(); unsubLog(); unsubMeta(); unsubConf(); unsubPts(); unsubAdmins(); unsubLock(); };
            }, [isCloudActive]);

            useEffect(() => {
                if (categories.length > 0) {
                    if (!bestAthleteMaleCat) setBestAthleteMaleCat(categories.find(c => !c.toUpperCase().startsWith('P')) || "");
                    if (!bestAthleteFemaleCat) setBestAthleteFemaleCat(categories.find(c => !c.toUpperCase().startsWith('L')) || "");
                }
            }, [categories]);

            useEffect(() => {
                if (!currentUser) return;
                const email = (currentUser.email || "").toLowerCase();
                if (email === "sekolah-7608@moe-dl.edu.my" || adminList.map(a => typeof a === 'string' ? a.toLowerCase() : "").includes(email)) setUserRole("admin");
                else if (email.endsWith("@moe-dl.edu.my") || email.endsWith("@moe.edu.my")) setUserRole("guru");
                else {
                    const localR = localStorage.getItem('sps_local_role');
                    if (localR) { setUserRole(localR); }
                    else if (!currentUser.isAnonymous) setUserRole("pelawat");
                }
            }, [currentUser, adminList]);

            const showToastMessage = (message, type = "success") => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: "", type: "info" }), 4000);
            };

            const createLog = async (action, details) => {
                const logData = { id: "log_" + Date.now(), timestamp: getCurrentFormattedDate() + " " + new Date().toLocaleTimeString('ms-MY'), userEmail: currentUser?.email || "Anonym", userName: currentUser?.displayName || "Pengguna", action, details };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('logs').doc(logData.id).set(logData);
                else setLogs(prev => [logData, ...prev]);
            };

            const checkAuth = () => {
                if (userRole === "pelawat") { showToastMessage("Akses Dihalang.", "error"); return false; } 
                if (isSystemLocked) { showToastMessage("Sistem telah dikunci oleh Admin (Mod Baca Sahaja)!", "error"); return false; }
                return true;
            };

            const houseStandings = useMemo(() => {
                const houses = {};
                Object.keys(housesMetadata).forEach(name => {
                    const meta = housesMetadata[name]; const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                    houses[name] = { emas: 0, perak: 0, gangsa: 0, keempat: 0, mata: parseInt(meta.bonusPoints)||0, warna: preset.warna, teks: preset.teks, glow: preset.glow, slogan: meta.slogan };
                });
                
                (results || []).forEach(res => {
                    const evExists = events.some(e => e.id === res.eventId);
                    if (!evExists) return;

                    let targetHouse = null;
                    if (res.athleteId && res.athleteId.startsWith("TEAM_")) {
                        targetHouse = res.athleteId.split('_')[1];
                    } else {
                        const ath = (athletes || []).find(a => a.id === res.athleteId);
                        if (ath) targetHouse = ath.rumah;
                    }

                    if (targetHouse && houses[targetHouse]) {
                        const h = houses[targetHouse];
                        if (res.kedudukan === "1") { h.emas++; h.mata += pointsConfig.emas; }
                        else if (res.kedudukan === "2") { h.perak++; h.mata += pointsConfig.perak; }
                        else if (res.kedudukan === "3") { h.gangsa++; h.mata += pointsConfig.gangsa; }
                        else if (res.kedudukan === "4") { h.keempat++; h.mata += pointsConfig.keempat; }
                    }
                });

                return Object.entries(houses).map(([nama, data]) => ({ nama, ...data })).sort((a, b) => {
                    if (b.emas !== a.emas) return b.emas - a.emas;
                    if (b.perak !== a.perak) return b.perak - a.perak;
                    if (b.gangsa !== a.gangsa) return b.gangsa - a.gangsa;
                    if (b.keempat !== a.keempat) return b.keempat - a.keempat;
                    return b.mata - a.mata;
                });
            }, [results, athletes, events, pointsConfig, housesMetadata]);

            const eventsWithCode = useMemo(() => {
                const uniqueDates = Array.from(new Set((events||[]).map(e => e.tarikh).filter(Boolean))).sort();
                return (events||[]).map((ev, idx) => {
                    const day = uniqueDates.indexOf(ev.tarikh) + 1 || 1;
                    const autoCode = `${day}${String(idx+1).padStart(2,'0')}`;
                    return { ...ev, kodAcara: ev.noAcara || autoCode };
                }).sort((a,b) => {
                    const aNum = parseInt(a.noAcara); const bNum = parseInt(b.noAcara);
                    if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
                    return (a.noAcara||"").localeCompare(b.noAcara||"") || (a.tarikh||"").localeCompare(b.tarikh||"") || (a.masa||"").localeCompare(b.masa||"");
                });
            }, [events]);

            const calculateBest = (gender, cat) => {
                if (!cat) return [];
                const catAthletes = athletes.filter(a => a.jantina === gender && (a.kategori === cat || categoriesMatch(a.kategori, cat)));
                const stats = catAthletes.map(ath => {
                    let g=0, s=0, b=0, k=0, pts=0, bg=0, bs=0, bb=0;
                    let senaraiAcara = [];
                    results.forEach(r => {
                        const ev = events.find(e => e.id === r.eventId);
                        if (!ev) return;
                        
                        let isWinner = false;
                        if (r.athleteId === ath.id) {
                            isWinner = true;
                        } else if (ev.format === "Berkumpulan" && r.athleteId && r.athleteId.startsWith("TEAM_")) {
                            const parts = r.athleteId.split('_');
                            if (ath.rumah === parts[1] && ath.acaraIds && ath.acaraIds.includes(ev.id)) {
                                const rData = (ath.relayData && ath.relayData[ev.id]) || { pasukan: "A", pelari: "1" };
                                if (rData.pasukan === parts[2]) {
                                    isWinner = true;
                                }
                            }
                        }

                        if (isWinner) {
                            let pingat = "";
                            if(r.kedudukan==="1"){g++; pts+=pointsConfig.emas; if(ev.jenis==="Balapan") bg++; pingat = "Emas";}
                            else if(r.kedudukan==="2"){s++; pts+=pointsConfig.perak; if(ev.jenis==="Balapan") bs++; pingat = "Perak";}
                            else if(r.kedudukan==="3"){b++; pts+=pointsConfig.gangsa; if(ev.jenis==="Balapan") bb++; pingat = "Gangsa";}
                            else if(r.kedudukan==="4"){k++; pts+=pointsConfig.keempat; pingat = "Ke-4";}

                            if(pingat) senaraiAcara.push({ namaAcara: ev.nama, kategori: ev.kategori, pingat: pingat, kedudukan: r.kedudukan });
                        }
                    });
                    return { ...ath, g, s, b, k, pts, bg, bs, bb, senaraiAcara };
                }).filter(a => (a.g>0||a.s>0||a.b>0||a.k>0||a.pts>0));
                
                stats.sort((x,y) => {
                    if (y.g !== x.g) return y.g - x.g;
                    if (y.s !== x.s) return y.s - x.s;
                    if (y.b !== x.b) return y.b - x.b;
                    if (y.k !== x.k) return y.k - x.k;
                    if (y.pts !== x.pts) return y.pts - x.pts;
                    if (y.bg !== x.bg) return y.bg - x.bg;
                    if (y.bs !== x.bs) return y.bs - x.bs;
                    if (y.bb !== x.bb) return y.bb - x.bb;
                    return 0;
                });
                if (stats.length === 0) return [];
                const top = stats[0];
                return stats.filter(a => a.g===top.g && a.s===top.s && a.b===top.b && a.k===top.k && a.pts===top.pts && a.bg===top.bg && a.bs===top.bs && a.bb===top.bb);
            };

            const calculateOverallBest = (gender) => {
                const catAthletes = athletes.filter(a => a.jantina === gender);
                const stats = catAthletes.map(ath => {
                    let g=0, s=0, b=0, k=0, pts=0, bg=0, bs=0, bb=0;
                    let senaraiAcara = [];
                    results.forEach(r => {
                        const ev = events.find(e => e.id === r.eventId);
                        if (!ev) return;
                        
                        let isWinner = false;
                        if (r.athleteId === ath.id) {
                            isWinner = true;
                        } else if (ev.format === "Berkumpulan" && r.athleteId && r.athleteId.startsWith("TEAM_")) {
                            const parts = r.athleteId.split('_');
                            if (ath.rumah === parts[1] && ath.acaraIds && ath.acaraIds.includes(ev.id)) {
                                const rData = (ath.relayData && ath.relayData[ev.id]) || { pasukan: "A", pelari: "1" };
                                if (rData.pasukan === parts[2]) {
                                    isWinner = true;
                                }
                            }
                        }

                        if (isWinner) {
                            let pingat = "";
                            if(r.kedudukan==="1"){g++; pts+=pointsConfig.emas; if(ev.jenis==="Balapan") bg++; pingat = "Emas";}
                            else if(r.kedudukan==="2"){s++; pts+=pointsConfig.perak; if(ev.jenis==="Balapan") bs++; pingat = "Perak";}
                            else if(r.kedudukan==="3"){b++; pts+=pointsConfig.gangsa; if(ev.jenis==="Balapan") bb++; pingat = "Gangsa";}
                            else if(r.kedudukan==="4"){k++; pts+=pointsConfig.keempat; pingat = "Ke-4";}

                            if(pingat) senaraiAcara.push({ namaAcara: ev.nama, kategori: ev.kategori, pingat: pingat, kedudukan: r.kedudukan });
                        }
                    });
                    return { ...ath, g, s, b, k, pts, bg, bs, bb, senaraiAcara };
                }).filter(a => (a.g>0||a.s>0||a.b>0||a.k>0||a.pts>0));

                stats.sort((x,y) => {
                    if (y.g !== x.g) return y.g - x.g;
                    if (y.s !== x.s) return y.s - x.s;
                    if (y.b !== x.b) return y.b - x.b;
                    if (y.k !== x.k) return y.k - x.k;
                    if (y.pts !== x.pts) return y.pts - x.pts;
                    if (y.bg !== x.bg) return y.bg - x.bg;
                    if (y.bs !== x.bs) return y.bs - x.bs;
                    if (y.bb !== x.bb) return y.bb - x.bb;
                    return 0;
                });
                if (stats.length === 0) return [];
                const top = stats[0];
                return stats.filter(a => a.g===top.g && a.s===top.s && a.b===top.b && a.k===top.k && a.pts===top.pts && a.bg===top.bg && a.bs===top.bs && a.bb===top.bb);
            };

            const uniqueEventDates = Array.from(new Set(events.map(e => e.tarikh).filter(Boolean))).sort();

            const generatePredictions = () => {
                const nextYear = (parseInt(activeYear) || new Date().getFullYear()) + 1;
                
                const getIsYear6 = (ath) => {
                    if(!ath) return false;
                    const catStr = (ath.kategori||"").toLowerCase();
                    const klsStr = (ath.kelas||"").toLowerCase();
                    if(catStr.includes('12') || klsStr.includes('6')) return true;

                let predictedHousePoints = {};
                Object.keys(housesMetadata).forEach(name => {

                });

                let predictedEvents = [];

                eventsWithCode.forEach(ev => {
                    const evResults = results.filter(r => r.eventId === ev.id).sort((a,b) => parseInt(a.kedudukan) - parseInt(b.kedudukan));
                    let remainingParticipants = [];

                    evResults.forEach(r => {
                        let isTeam = false;
                        let isYear6 = false;
                        let targetHouse = null;
                        let nameDisplay = "";

                        if (r.athleteId && r.athleteId.startsWith("TEAM_")) {
                            isTeam = true;
                            const parts = r.athleteId.split('_');

                            else if (newRank === "2") { h.perak++; h.mata += pointsConfig.perak; }
                            else if (newRank === "3") { h.gangsa++; h.mata += pointsConfig.gangsa; }
                            else if (newRank === "4") { h.keempat++; h.mata += pointsConfig.keempat; }

                    return { nama, ...data, warna: preset.warna, teks: preset.teks, glow: preset.glow };
                }).sort((a, b) => {
                    if (b.emas !== a.emas) return b.emas - a.emas;

                    if (b.gangsa !== a.gangsa) return b.gangsa - a.gangsa;
                    if (b.keempat !== a.keempat) return b.keempat - a.keempat;
                    return b.mata - a.mata;
                });

                return { year: nextYear, houses: sortedHouses, events: predictedEvents };

                                Rumah: <strong>Rumah ${targetData.rumah}</strong> | Kelas: <strong>${targetData.kelas}</strong>

                            ${achievementText}

                                    <p style="margin: 0; color: #64748b;">${certSignatory2Title}</p>

                                    <p style="margin: 0; color: #64748b;">${certSignatory3Title}</p>
                                </div>` : ''}
                            </div>
                        </div>
                    `;

                let newAcaraIds = ath.acaraIds || [];
                if (isCurrentlyRegistered) {
                    newAcaraIds = newAcaraIds.filter(id => id !== eventId);
                } else {
                    newAcaraIds.push(eventId);
                }
                
                if (isCloudActive && db) {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(athId).update({ acaraIds: newAcaraIds });

                    setAthletes(athletes.map(a => a.id === athId ? { ...a, acaraIds: newAcaraIds } : a));
                }
            };

                                    </div>

                        {}

                                                    </div>
                                                </div>
                                            </div>

                                            {eventsWithCode.filter(ev => selectedEventDate === "Semua" || ev.tarikh === selectedEventDate).map((ev, index) => {
                                                const isSelesai = results.some(r => r.eventId === ev.id);
                                                return (
                                                    <tr key={ev.id} className="border-b hover:bg-slate-50 transition">
                                                        <td className="px-4 py-3 font-bold text-slate-400">{index + 1}</td>
                                                        <td className="px-4 py-3 font-mono font-bold text-indigo-600">{ev.kodAcara}</td>
                                                        <td className="px-4 py-3 font-bold">{ev.nama} {isSelesai && <span className="ml-2 text-[9px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full uppercase tracking-wider">Selesai</span>}</td>
                                                        <td className="px-4 py-3"><span className="bg-slate-200 px-2 py-1 rounded text-xs font-semibold">{ev.kategori}</span></td>
                                                        <td className="px-4 py-3 text-center space-x-1 whitespace-nowrap">
                                                            <button onClick={() => { setActiveRegEvent(ev); setRegModalHouseFilter("Semua"); setRegModalCategoryFilter("Semua"); setIsEventRegModalOpen(true); }} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">Daftar Atlet Pusat</button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === "atlit" && userRole !== "pelawat" && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border animate-fade-in relative">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b gap-4">
                                    <h2 className="text-xl font-black text-slate-800">Senarai Keseluruhan Atlet</h2>
                                </div>
                                <div className="overflow-x-auto rounded-xl border">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-100 text-slate-700 uppercase text-xs font-black">
                                            <tr>
                                                <th className="px-4 py-3">Nama Atlet</th>
                                                <th className="px-4 py-3">Kelas / Tahun</th>
                                                <th className="px-4 py-3">Rumah</th>
                                                <th className="px-4 py-3">Kategori</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {athletes.slice(0, 20).map((ath, idx) => (
                                                <tr key={ath.id} className="border-b hover:bg-slate-50 transition">
                                                    <td className="px-4 py-3 font-bold">{ath.nama}</td>
                                                    <td className="px-4 py-3 text-slate-600">{ath.kelas}</td>
                                                    <td className="px-4 py-3"><span className={`px-2 py-1 rounded text-[10px] font-bold ${(COLOR_PRESETS[housesMetadata[ath.rumah]?.warnaLabel] || COLOR_PRESETS.Merah).bg} ${(COLOR_PRESETS[housesMetadata[ath.rumah]?.warnaLabel] || COLOR_PRESETS.Merah).text}`}>{ath.rumah}</span></td>
                                                    <td className="px-4 py-3"><span className="bg-slate-200 px-2 py-1 rounded text-xs font-semibold">{ath.kategori}</span></td>
                                                </tr>
                                            ))}
                                            {athletes.length === 0 && <tr><td colSpan="4" className="text-center py-8 text-slate-400 italic">Tiada atlet.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === "keputusan" && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border animate-fade-in">
                                <h2 className="text-xl font-black text-slate-800 mb-6 pb-4 border-b">Kemasukan Keputusan Acara</h2>
                                <div className="max-w-2xl bg-slate-50 border p-6 rounded-2xl">
                                    <form onSubmit={handleResultSubmit} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Pilih Acara</label>
                                            <select required value={resultForm.eventId} onChange={e => setResultForm({...resultForm, eventId: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-4 py-2 text-sm focus:border-indigo-500 outline-none bg-white">
                                                <option value="">-- Pilih Acara --</option>
                                                {eventsWithCode.map(ev => <option key={ev.id} value={ev.id}>[{ev.kodAcara}] {ev.nama} ({ev.kategori})</option>)}
                                            </select>
                                        </div>
                                        {resultForm.eventId && (
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Pilih Pemenang</label>
                                                <select required value={resultForm.athleteId} onChange={e => setResultForm({...resultForm, athleteId: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-4 py-2 text-sm focus:border-indigo-500 outline-none bg-white">
                                                    <option value="">-- Pilih Pemenang --</option>
                                                    {athletes.filter(a => a.acaraIds && a.acaraIds.includes(resultForm.eventId)).map(ath => (
                                                        <option key={ath.id} value={ath.id}>{ath.nama} (Rumah {ath.rumah})</option>
                                                    ))}
                                                </select>
                                            </div>
                                        )}
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Kedudukan</label>
                                                <select value={resultForm.kedudukan} onChange={e => setResultForm({...resultForm, kedudukan: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-4 py-2 text-sm outline-none bg-white">
                                                    <option value="1">Pertama (Emas)</option><option value="2">Kedua (Perak)</option><option value="3">Ketiga (Gangsa)</option><option value="4">Keempat</option>
                                                </select>
                                            </div>
                                            <div className="flex-1">
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Catatan (Masa/Jarak)</label>
                                                <input type="text" value={resultForm.catatan} onChange={e => setResultForm({...resultForm, catatan: e.target.value})} className="w-full border-2 border-slate-200 rounded-xl px-4 py-2 text-sm outline-none bg-white" placeholder="Cth: 12.4s" />
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition">Kunci Keputusan</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === "ramalan" && userRole === "admin" && predictions && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border animate-fade-in">
                                <h2 className="text-xl font-black text-slate-800 mb-6 pb-4 border-b">Ramalan Potensi Tahun Hadapan ({predictions.year})</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                                    {predictions.houses.map((h, i) => (
                                        <div key={h.nama} className={`bg-white border p-4 rounded-2xl relative ${h.glow}`}>
                                            <div className={`absolute top-0 left-0 w-full h-1.5 ${h.warna}`}></div>
                                            <h3 className="font-black text-lg text-slate-800">Rumah {h.nama}</h3>
                                            <p className={`text-2xl font-black ${h.teks}`}>{h.mata} Mata</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === "pasca_sukan" && userRole !== "pelawat" && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border animate-fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b gap-4">
                                    <h2 className="text-xl font-black text-slate-800">Pasca Sukan (Sijil & Laporan)</h2>
                                    <button onClick={() => executeBypassPrint('kokum')} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md transition">🖨️ Cetak Laporan Rasmi</button>
                                </div>
                                <div className="overflow-x-auto rounded-xl border mt-6">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-100 text-slate-700 uppercase text-xs font-black">
                                            <tr>
                                                <th className="px-4 py-3">Nama Atlet</th>
                                                <th className="px-4 py-3">Pencapaian</th>
                                                <th className="px-4 py-3 text-center">Cetak Sijil</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {athletes.filter(a => results.some(r => r.athleteId === a.id)).slice(0, 30).map((ath) => (
                                                <tr key={ath.id} className="border-b hover:bg-slate-50 transition">
                                                    <td className="px-4 py-3 font-bold">{ath.nama} <span className="block text-[10px] font-normal text-slate-500">Rumah {ath.rumah}</span></td>
                                                    <td className="px-4 py-3 text-[10px] text-slate-600">Pemenang Pingat</td>
                                                    <td className="px-4 py-3 text-center">
                                                        <button onClick={() => executeBypassPrint('sijil', ath)} className="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">Cetak Sijil</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {isEventRegModalOpen && activeRegEvent && (
                        <div className="fixed inset-0 z-[9999] bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-4xl shadow-2xl max-h-[90vh] overflow-hidden flex flex-col">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h2 className="text-xl font-black text-slate-800">Daftar Atlet: {activeRegEvent.nama}</h2>
                                    <button onClick={() => setIsEventRegModalOpen(false)} className="text-slate-400 hover:text-red-500 font-bold">✕ Tutup</button>
                                </div>
                                <div className="flex flex-col md:flex-row gap-3 mb-4">
                                    <select value={regModalHouseFilter} onChange={e => setRegModalHouseFilter(e.target.value)} className="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none flex-1">
                                        <option value="Semua">Semua Rumah Sukan</option>
                                        {Object.keys(housesMetadata).map(h => <option key={h} value={h}>{h}</option>)}
                                    </select>
                                    <select value={regModalCategoryFilter} onChange={e => setRegModalCategoryFilter(e.target.value)} className="border-2 border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none flex-1">
                                        <option value="Semua">Semua Kategori</option>
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div className="flex-1 overflow-y-auto border rounded-xl p-2 bg-slate-50">
                                    {athletes.filter(a => (regModalHouseFilter === "Semua" || a.rumah === regModalHouseFilter) && (regModalCategoryFilter === "Semua" || a.kategori === regModalCategoryFilter)).map(ath => {
                                        const isRegistered = ath.acaraIds && ath.acaraIds.includes(activeRegEvent.id);
                                        return (
                                            <div key={ath.id} className="flex justify-between items-center p-2 border-b last:border-b-0 hover:bg-white transition rounded">
                                                <div>
                                                    <p className="font-bold text-sm text-slate-800">{ath.nama}</p>
                                                    <p className="text-xs text-slate-500">{ath.kelas} | Rumah {ath.rumah} | {ath.kategori}</p>
                                                </div>
                                                <button onClick={() => handleToggleRegistration(ath.id, activeRegEvent.id, isRegistered)} className={`px-4 py-1.5 rounded-lg text-xs font-bold shadow-sm ${isRegistered ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-emerald-600 text-white hover:bg-emerald-500'}`}>
                                                    {isRegistered ? 'Batal' : 'Daftar'}
                                                </button>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {isPreviewModalOpen && (
                        <div className="fixed inset-0 z-[10000] bg-slate-900/80 backdrop-blur-sm flex flex-col md:flex-row items-center justify-center p-4 md:p-8 animate-fade-in">
                            {currentPrintMode === 'sijil' && (
                                <div className="bg-white rounded-2xl p-4 mr-0 mb-4 md:mb-0 md:mr-4 flex flex-row md:flex-col gap-4 shadow-2xl shrink-0 z-20">
                                    <h3 className="text-xs font-bold text-center border-b pb-2 mb-1 hidden md:block text-slate-700">Kongsi</h3>
                                    <a href={`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`} target="_blank" className="bg-emerald-500 flex items-center justify-center text-white w-12 h-12 rounded-full hover:scale-110 transition shadow-md" title="WhatsApp">
                                        <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                                    </a>
                                    <a href={`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(shareText)}`} target="_blank" className="bg-sky-500 flex items-center justify-center text-white w-12 h-12 rounded-full hover:scale-110 transition shadow-md" title="Telegram">
                                        <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                                    </a>
                                    {navigator.share && (
                                        <button onClick={() => navigator.share({ title: 'Pencapaian Sukan', text: shareText })} className="bg-indigo-500 flex items-center justify-center text-white w-12 h-12 rounded-full hover:scale-110 transition shadow-md" title="Share peranti...">
                                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                                        </button>
                                    )}
                                </div>
                            )}
                            <div className="bg-slate-100 w-full max-w-5xl h-[85vh] md:h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden relative">
                                <div className="flex-1 w-full bg-slate-300/50 p-2 sm:p-6 overflow-hidden relative flex justify-center">
                                    <iframe id="preview-frame" srcDoc={previewContent} className="w-full h-full border-none sm:rounded-xl shadow-lg relative z-10" />
                                </div>
                                <div className="p-4 bg-white flex justify-end gap-3 text-xs font-bold border-t z-10 shrink-0">
                                    {currentPrintMode === 'kokum' && (
                                        <button onClick={handleSaveKokumManualToCloud} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl shadow-lg transition mr-auto">💾 Simpan Laporan Manual</button>
                                    )}
                                    <button onClick={()=>setIsPreviewModalOpen(false)} className="bg-slate-200 hover:bg-slate-300 px-6 py-3 rounded-xl transition">Tutup</button>
                                    <button onClick={()=>{const f=document.getElementById('preview-frame');if(f){f.contentWindow.focus();f.contentWindow.print();}}} className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl shadow-lg transition">Cetak Dokumen</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast.show && (
                        <div className="fixed bottom-6 right-6 z-[10001] bg-slate-900 text-white px-6 py-4 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-3 animate-slide-up">
                            {toast.type === "error" ? "⚠️" : "✅"} <span>{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
